# PaperJoy 发布元数据（manifest）
# 用途：上架到 WorkBuddy 公共技能市场时填写的信息模板。
# 说明：网页端市场的表单通常会逐项收集以下字段，本文件可直接照抄填入；
#       具体字段名以你发布时所用门户（SkillHub / ClawHub 等）的表单为准。
# 关键信息已尽量与 SKILL.md 的 frontmatter 保持一致，避免冲突。

name: paper-joy                # 必须：英文连字符格式，且 == SKILL.md 的 frontmatter name
display_name: PaperJoy            # 展示名
slug: paper-joy               # 市场 URL 标识，小写+连字符，建议与 name 一致
version: 1.0.4                  # 语义化版本号；每次更新须递增（如 1.0.3 -> 1.0.4）
author: "YouYang (youyang9205)"
description: >-
  一款可跨平台安装的学术文献结构化剖析提示词/技能——将任意主流 AI 助手（WorkBuddy、Claude、ChatGPT、Cursor、Gemini 等）
  配置为严谨、客观、洞察力极强的跨学科文献分析助手。
  粘贴/上传论文即可自动完成文本降噪、高密度摘要（TL;DR）、核心术语降维解释、多维度深度剖析（含强制图文映射）、
  Mermaid 技术路线重构（含试验时间线标注与试验时间分配表）、可复现性评估与延伸探索。
  同时提供 PROMPT.md 通用提示词版，可粘贴进任何支持自定义指令的 AI 客户端。
category: 通用工具              # 市场分类，可选：通用工具 / 研发开发 / 办公效率 等，按门户实际分类选最贴近的
triggers:                      # 触发词（用户说这些话时自动调起本技能）；覆盖书面语 + 口语，防止搜不到/说不出
  - 分析这篇文献
  - 读一下这篇论文
  - 剖析这篇文章
  - 帮我拆解这篇论文
  - PaperJoy
  - 用 PaperJoy 分析一下
  - 帮我把这篇论文读一下
  - 这篇文献主要讲啥
  - 给我讲讲这篇文章
  - 这篇论文是怎么做的
  - 拆解这篇论文
  - 帮我总结这篇文献
  - 这篇论文核心贡献是啥
  - 读文献
  - 论文精读
  - 这篇研报帮我捋一捋
tags:
  - 学术
  - 文献分析
  - 科研
  - 论文阅读
  - 综述
  - 研究生
requires_api_key: false        # 本技能为纯提示词技能，不调用任何外部 API/密钥，安全扫描易通过
changelog: |
  1.0.4 - 回应 TRACE 全维测评低分项（反模式/FAQ 3.5、异常处理 4.0、能力边界 4.5）
    - SKILL.md 新增四节：六·输入要求与最佳实践（含复杂格式处理、单次≤20页建议）、七·能力边界与限制（明确「能做/不能做」清单）、八·常见错误用法（反模式·不要这样做）、九·常见问题 FAQ
    - 模块一新增「输入校验 Input Gate」：输入不足（仅标题/纯图无文/乱码）时，首条回复即输出具体补充指引，消除「提示含糊」问题
    - 文档规范化补齐：新增 FAQ 与反模式，降低新手误用率
  1.0.3 - 回应使用反馈：消除冗余 + 明确效果边界
    - 单一信息源：SKILL.md 为唯一手工维护文件；PROMPT.md 改由 tools/build_prompt.py 自动生成并移出版本跟踪（gitignore），不再有两份手维护的重复核心文件、不占仓库空间
    - 提示词新增「输出前质量自检」强制清单（模块齐备/图文映射/零虚构/Mermaid 可渲染/语言一致），拉平不同模型产出方差
    - README 新增「模型适配建议」小节：诚实说明效果上界由基础模型决定、已内置护栏把方差压到最低，并给出推荐模型
    - 下载入口统一指向 Release 资产
  1.0.2 - 跨平台化（让主流 AI 软件都能装）
    - 新增 PROMPT.md：去平台标记的纯提示词版，可粘贴进任意支持自定义指令/System Prompt 的 AI 客户端
    - README 重写为跨平台安装：方式A 粘贴提示词(通用) / 方式B 放入 skills 文件夹(WorkBuddy·Claude·Cursor 等) / 方式C 上架各市场
    - 去除 WorkBuddy 专属表述；manifest.description 泛化为「任意主流 AI 助手」
  1.0.1 - 公开更名记录同步（市场侧对齐）
    - 已发布版本更名：展示名「文献悦读」→「PaperJoy」，内部标识 literature-yuedu → paper-joy（功能不变）
    - 补充 README 仓库徽章与 v1.0.1 更新日志，便于市场/网友识别为同款技能迭代而非新品
  1.0.0 - 初始发布
    - 七模块剖析框架：文本降噪(内部) / TL;DR(≤200字+星级) / 核心术语表 /
      多维度剖析(含强制图文映射) / 技术路线重构(含试验时间线标注+试验时间分配表) /
      可复现性评估 / 延伸探索
    - 曾用名「文献悦读」，内部标识原 literature-yuedu；2026-08-15 统一更名为 PaperJoy / paper-joy
